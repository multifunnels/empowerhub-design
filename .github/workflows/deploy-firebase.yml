name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json lags behind Lovable's bun.lockb, so `npm ci` fails
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/985980954690/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@tsionline-org.iam.gserviceaccount.com

      - run: npx --yes firebase-tools@14 deploy --only hosting --project tsionline-org --non-interactive
